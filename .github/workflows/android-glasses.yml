name: Build FAMILIAR M6 Android APK
on:
  push:
    paths:
      - 'glasses-android/**'
      - '.github/workflows/android-glasses.yml'
  pull_request:
    paths:
      - 'glasses-android/**'
      - '.github/workflows/android-glasses.yml'
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # GitHub's Ubuntu runner already has Android command-line tools installed.
      # android-actions/setup-android@v3 invokes a removed legacy "tools" package
      # on the Nov 2026 runners, so call sdkmanager directly instead.
      - name: Install Android API 34
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Compile M6 demo APK
        run: cd glasses-android && gradle --no-daemon :app:assembleDebug
      - name: Upload APK for team testing
        uses: actions/upload-artifact@v4
        with:
          name: FAMILIAR-M6-debug-apk
          path: glasses-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
